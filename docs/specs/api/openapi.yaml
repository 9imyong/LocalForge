openapi: 3.1.0
info:
  title: 프로젝트 API
  version: 0.1.0
  description: |-
    프로젝트의 HTTP API 계약입니다.
    실제 기능을 구현할 때 경로, 오류 응답, 인증 방식을 구체화합니다.
servers:
  - url: http://localhost:3000
    description: 로컬 개발 환경
paths:
  /health:
    get:
      summary: 서비스 상태 확인
      operationId: getHealth
      responses:
        '200':
          description: 서비스가 요청을 처리할 수 있음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          description: 현재 서비스 상태
          enum: [ok]
          examples: [ok]
